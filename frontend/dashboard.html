<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expert Dashboard | KhetLoop</title>
  <link rel="icon" type="image/png" href="assets/img/logo-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Kannada:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/config.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/ui.js"></script>

  <style>
    .dash { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 24px; align-items: start; }
    .queue { position: sticky; top: calc(var(--nav-h) + 16px); display: grid; gap: 14px; max-height: calc(100vh - var(--nav-h) - 40px); }
    .queue-top { display: grid; gap: 12px; }
    .queue-list { display: grid; gap: 10px; overflow-y: auto; padding: 2px 4px 2px 0; }
    .q-item { display: flex; gap: 12px; padding: 10px; border-radius: 14px; border: 1px solid var(--border); background: rgba(255, 255, 255, .03); cursor: pointer; transition: border-color .25s, background .25s, transform .25s var(--ease); outline: none; }
    .q-item:hover, .q-item:focus-visible { border-color: var(--border-strong); background: rgba(163, 214, 92, .06); transform: translateX(3px); }
    .q-item.on { border-color: var(--lime); background: rgba(163, 214, 92, .1); box-shadow: inset 0 0 0 1px var(--lime); }
    .q-thumb { flex: none; width: 78px; height: 78px; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
    .q-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .q-thumb .img-fallback { min-height: 0; font-size: 10px; text-align: center; }
    .q-body { display: grid; gap: 4px; min-width: 0; align-content: start; }
    .q-body strong { font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.1; }
    .q-body small { color: var(--muted); font-size: 12.5px; }
    .q-chips { display: flex; gap: 6px; flex-wrap: wrap; }

    .detail { display: grid; gap: 22px; min-width: 0; }
    .d-head { display: grid; gap: 14px; }
    .d-head h2 { font-size: clamp(34px, 4.4vw, 52px); }
    .d-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
    .d-col { display: grid; gap: 22px; }
    .photo { aspect-ratio: 4 / 3; border-radius: var(--radius); overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .quote { padding: 14px 16px; border-left: 2px solid var(--lime); border-radius: 0 12px 12px 0; background: rgba(163, 214, 92, .06); line-height: 1.7; }
    .kv2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
    .kv2 span { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: 2px; }
    .kv2 b { font-weight: 600; }
    .wx { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .wx-tile { padding: 12px; border-radius: 12px; background: rgba(255, 255, 255, .03); border: 1px solid var(--border); }
    .wx-tile span { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
    .wx-tile b { font-family: var(--font-display); font-size: 28px; font-weight: 600; }
    .reasons { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; }
    .small { font-size: 12.5px; color: var(--faint); }
    .hist { display: grid; gap: 10px; }
    .h-item { display: grid; gap: 4px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255, 255, 255, .025); color: var(--text); transition: border-color .25s, background .25s, transform .25s var(--ease); }
    .h-item:hover { border-color: var(--border-strong); background: rgba(163, 214, 92, .06); transform: translateX(3px); }
    .h-item.current { border-color: var(--lime); }
    .h-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
    .h-item small { color: var(--muted); }
    .success-banner { display: flex; gap: 14px; align-items: flex-start; padding: 16px 20px; border-radius: var(--radius); border: 1px solid rgba(111, 224, 166, .5); background: rgba(111, 224, 166, .08); }
    .success-banner strong { display: block; color: #9af0c4; font-family: var(--font-display); font-size: 24px; font-weight: 600; }
    .success-banner p { color: var(--muted); font-size: 14px; }
    .form-note { font-size: 12.5px; color: var(--faint); }
    .placeholder { min-height: 360px; align-content: center; }
    #formError { margin-top: 12px; }
    .guidance { line-height: 1.7; font-size: 16px; }

    @media (max-width: 1100px) { .dash { grid-template-columns: 1fr; } .queue { position: static; max-height: none; } .queue-list { max-height: 380px; } }
    @media (max-width: 900px) { .d-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="page-head">
        <span class="eyebrow">Expert dashboard</span>
        <h1>Review with full context</h1>
        <p class="muted" style="max-width:640px">Open a case to see the photo, weather, farm history and AI findings together, then send verified guidance to the farmer.</p>
      </div>

      <div class="dash">
        <aside class="card queue" aria-label="Case queue">
          <div class="queue-top">
            <div class="row between">
              <div class="card-title" style="margin:0">Case queue <span id="qCount" class="chip" style="margin-left:6px">&hellip;</span></div>
              <button type="button" class="btn btn-ghost btn-sm" id="refreshBtn">Refresh</button>
            </div>
            <div class="field">
              <label for="statusFilter">Status</label>
              <select class="select" id="statusFilter"></select>
            </div>
          </div>
          <div class="queue-list" id="queueList"></div>
        </aside>

        <section class="detail" id="detail" aria-live="polite"></section>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/components/dataSourceBadge.js"></script>
  <script src="js/components/statusTimeline.js"></script>
  <script src="js/components/whyBox.js"></script>
  <script src="js/components/reportCard.js"></script>
  <script>
    UI.mountNavbar("dashboard");
    UI.mountFooter();

    var queueList = document.getElementById("queueList");
    var detail = document.getElementById("detail");
    var qCount = document.getElementById("qCount");
    var statusFilter = document.getElementById("statusFilter");

    var cases = [];
    var selectedId = null;
    var currentStatus = "expert_review_pending";
    var loadToken = 0;

    statusFilter.innerHTML = REPORT_STATUSES.map(function (s) {
      return '<option value="' + UI.esc(s) + '"' + (s === currentStatus ? " selected" : "") + ">" + UI.esc(UI.label(STATUS_LABELS, s)) + "</option>";
    }).join("");

    function isNum(v) { return typeof v === "number" && isFinite(v); }
    function dash(v, suffix) { return isNum(v) ? v + (suffix || "") : "\u2014"; }
    function findCase(id) { for (var i = 0; i < cases.length; i++) if (cases[i].report_id === id) return cases[i]; return null; }

    function placeholder() {
      detail.innerHTML = '<div class="card placeholder"><div class="empty" style="border:0;background:none"><strong>Select a case</strong><p>Choose a case from the queue to see its photo, history and AI findings.</p></div></div>';
    }

    /* ---------------- queue ---------------- */
    function renderQueue() {
      queueList.removeAttribute("aria-busy");
      qCount.textContent = cases.length;
      if (cases.length === 0) {
        UI.showEmpty(queueList, "No cases", "No reports have the status \u201c" + UI.label(STATUS_LABELS, currentStatus) + "\u201d right now.");
        return;
      }
      queueList.innerHTML = cases.map(function (c) {
        var on = c.report_id === selectedId;
        var chips = "";
        if (c.rain_expected === true) chips += '<span class="chip chip-lime">Rain expected</span>';
        if (c.escalation_reason) chips += '<span class="chip chip-warn" title="Escalation reason">' + UI.esc(c.escalation_reason) + "</span>";
        return '<div class="q-item' + (on ? " on" : "") + '" role="button" tabindex="0" data-id="' + UI.esc(c.report_id) + '">' +
          '<div class="q-thumb">' + UI.img(c.image_url, "Leaf photo") + "</div>" +
          '<div class="q-body"><strong>' + UI.esc(UI.label(ISSUE_LABELS, c.suspected_issue)) + "</strong>" +
          "<small>" + UI.esc(UI.label(CROP_LABELS, c.crop)) + " \u00b7 " + UI.esc(c.area_label || "Area not set") + "</small>" +
          "<small>" + UI.esc(UI.label(CONFIDENCE_LABELS, c.confidence_band)) + " \u00b7 " + UI.esc(UI.timeAgo(c.created_at) || UI.formatDate(c.created_at)) + "</small>" +
          (chips ? '<div class="q-chips">' + chips + "</div>" : "") + "</div></div>";
      }).join("");
    }

    async function loadQueue() {
      UI.showLoading(queueList, "lines", 4);
      qCount.textContent = "\u2026";
      var res = await listExpertCases(currentStatus);
      if (!res.ok) {
        qCount.textContent = "!";
        cases = [];
        UI.showError(queueList, res.error, loadQueue);
        if (selectedId === null) detail.innerHTML = "";
        return false;
      }
      cases = Array.isArray(res.data.cases) ? res.data.cases : [];
      if (selectedId === null && cases.length > 0) selectedId = cases[0].report_id;
      renderQueue();
      return true;
    }

    queueList.addEventListener("click", function (e) {
      var item = e.target.closest ? e.target.closest(".q-item") : null;
      if (item) selectCase(item.getAttribute("data-id"));
    });
    queueList.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var item = e.target.closest ? e.target.closest(".q-item") : null;
      if (item) { e.preventDefault(); selectCase(item.getAttribute("data-id")); }
    });
    statusFilter.addEventListener("change", function () {
      currentStatus = statusFilter.value;
      selectedId = null;
      init();
    });
    document.getElementById("refreshBtn").addEventListener("click", function () { init(true); });

    function selectCase(id) {
      selectedId = id;
      renderQueue();
      loadCase(id);
      if (window.innerWidth <= 1100) detail.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    /* ---------------- case detail ---------------- */
    function weatherHtml(w) {
      if (!w) return '<div class="empty empty-sm">Weather data was not available for this report.</div>';
      var rain = w.rain_expected === true ? "Yes" : w.rain_expected === false ? "No" : "\u2014";
      return '<div class="wx">' +
        '<div class="wx-tile"><span>Rain expected</span><b>' + rain + "</b></div>" +
        '<div class="wx-tile"><span>Rain, 48 h</span><b>' + dash(w.rain_mm_next_48h, " mm") + "</b></div>" +
        '<div class="wx-tile"><span>Humidity</span><b>' + dash(w.humidity_pct_avg, "%") + "</b></div>" +
        '<div class="wx-tile"><span>Temperature</span><b>' + dash(w.temp_c_avg, "\u00b0C") + "</b></div></div>" +
        '<p class="small" style="margin-top:10px">Fetched ' + UI.esc(UI.formatDateTime(w.fetched_at)) + "</p>";
    }

    function riskHtml(risk) {
      if (!risk) return '<div class="empty empty-sm">A risk indicator was not available.</div>';
      var el = risk.level === "elevated";
      var reasons = Array.isArray(risk.reasons) ? risk.reasons : [];
      return '<span class="chip ' + (el ? "chip-warn" : "chip-lime") + '" style="font-size:13px">' + (el ? "Elevated risk" : "Normal risk") + "</span>" +
        (reasons.length ? '<ul class="reasons">' + reasons.map(function (x) { return "<li>" + UI.esc(x) + "</li>"; }).join("") + "</ul>" : "");
    }

    function historyHtml(tl, currentReportId) {
      if (!tl) return "";
      if (!tl.ok) return '<div id="histErr"></div>';
      var items = Array.isArray(tl.data.items) ? tl.data.items : [];
      var farm = tl.data.farm || {};
      var head = '<p class="small" style="margin-bottom:12px">Sowing date: <b style="color:var(--text)">' +
        UI.esc(farm.sowing_date ? UI.formatDate(farm.sowing_date) : "not recorded") + "</b> \u00b7 " + items.length +
        (items.length === 1 ? " report" : " reports") + "</p>";
      if (items.length === 0) return head + '<div class="empty empty-sm">This farm has no earlier reports.</div>';
      return head + '<div class="hist">' + items.map(function (it) {
        return '<a class="h-item' + (it.report_id === currentReportId ? " current" : "") + '" href="report.html?id=' + encodeURIComponent(it.report_id) + '">' +
          '<div class="h-top"><b>' + UI.esc(UI.label(ISSUE_LABELS, it.suspected_issue)) + '</b><span class="pill pill-' + UI.esc(it.status) + '">' + UI.esc(UI.label(STATUS_LABELS, it.status)) + "</span></div>" +
          "<small>" + UI.esc(UI.formatDateTime(it.created_at)) + " \u00b7 " + UI.esc(UI.label(DECISION_LABELS, it.decision)) + (it.report_id === currentReportId ? " \u00b7 this case" : "") + "</small>" +
          (it.expert_guidance ? "<small>Guidance: " + UI.esc(UI.truncate(it.expert_guidance, 110)) + "</small>" : "") + "</a>";
      }).join("") + "</div>";
    }

    function reviewSection(r) {
      if (r.expert_review) {
        var rev = r.expert_review;
        return '<div class="card"><div class="row between" style="margin-bottom:14px"><div class="card-title" style="margin:0">Expert review</div><span class="pill pill-expert_reviewed">Expert Reviewed</span></div>' +
          '<p class="guidance">' + UI.esc(rev.guidance) + '</p><hr class="divider"><div class="kv2">' +
          "<div><span>Reviewed by</span><b>" + UI.esc(rev.expert_name || "\u2014") + "</b></div>" +
          "<div><span>Confirmed issue</span><b>" + UI.esc(UI.label(ISSUE_LABELS, rev.confirmed_issue)) + "</b></div>" +
          '<div style="grid-column:1/-1"><span>Reviewed on</span><b>' + UI.esc(UI.formatDateTime(rev.created_at)) + "</b></div></div></div>";
      }
      if (r.status !== "expert_review_pending") {
        return '<div class="card"><div class="card-title">Expert review</div><div class="empty empty-sm">This case is not awaiting expert review (status: ' + UI.esc(UI.label(STATUS_LABELS, r.status)) + ").</div></div>";
      }
      var opts = '<option value="">Not confirmed (leave empty)</option>' + ISSUES.map(function (i) {
        return '<option value="' + UI.esc(i) + '"' + (r.assessment && r.assessment.suspected_issue === i ? " selected" : "") + ">" + UI.esc(UI.label(ISSUE_LABELS, i)) + "</option>";
      }).join("");
      return '<div class="card"><div class="card-title">Your review</div>' +
        '<form id="reviewForm" class="stack" novalidate>' +
        '<div class="field"><label for="expertName">Expert name</label><input class="input" id="expertName" value="Demo Expert" maxlength="80" autocomplete="off" /></div>' +
        '<div class="field"><label for="guidance">Guidance for the farmer</label><textarea class="textarea" id="guidance" placeholder="e.g. Remove affected leaves and monitor the plant."></textarea></div>' +
        '<div class="field"><label for="confirmedIssue">Confirmed issue</label><select class="select" id="confirmedIssue">' + opts + "</select></div>" +
        '<p class="form-note">The farmer receives this guidance on Telegram and a follow-up reminder is scheduled. Do not include pesticide names or dosages.</p>' +
        '<button type="submit" class="btn btn-primary" id="submitBtn">Send review <span class="arrow">&rarr;</span></button>' +
        '<div id="formError"></div></form></div>';
    }

    function renderDetail(r, caseRow, tl, successReview) {
      var a = r.assessment || {};
      var symptoms = Array.isArray(a.visible_symptoms) ? a.visible_symptoms : [];
      var lang = r.voice_language || "en";
      var area = (caseRow && caseRow.area_label) || (tl && tl.ok && tl.data.farm && tl.data.farm.area_label) || "";
      var reason = caseRow && caseRow.escalation_reason;

      detail.innerHTML =
        (successReview ? '<div class="success-banner" role="status"><div><strong>Review sent</strong><p>Status is now <b>' + UI.esc(UI.label(STATUS_LABELS, r.status)) +
          "</b>. The farmer will be messaged and a follow-up reminder is scheduled.</p></div></div>" : "") +
        '<div class="d-head"><span class="eyebrow">' + UI.esc(UI.label(CROP_LABELS, r.crop)) + (area ? " \u00b7 " + UI.esc(area) : "") + "</span>" +
        "<h2>" + UI.esc(UI.label(ISSUE_LABELS, a.suspected_issue)) + "</h2>" +
        '<div class="row"><span class="pill pill-' + UI.esc(r.status) + '">' + UI.esc(UI.label(STATUS_LABELS, r.status)) + "</span>" + dataSourceBadge(r.data_source) +
        '<span class="muted" style="font-size:14px">Submitted ' + UI.esc(UI.formatDateTime(r.created_at)) + "</span>" +
        '<a class="btn btn-ghost btn-sm" href="report.html?id=' + encodeURIComponent(r.id) + '">Full report page</a></div></div>' +
        '<div class="d-grid"><div class="d-col">' +
        '<div class="card"><div class="card-title">Leaf photo</div><div class="photo">' + UI.img(r.image_url, "Leaf photo submitted by the farmer") + "</div></div>" +
        '<div class="card"><div class="card-title">Farmer\u2019s voice note \u00b7 ' + UI.esc(UI.label(LANGUAGE_LABELS, lang)) + "</div>" +
        (r.voice_transcript ? '<div class="quote" lang="' + UI.esc(lang) + '">' + UI.esc(r.voice_transcript) + "</div>" : '<div class="empty empty-sm">No voice note or description was recorded.</div>') + "</div>" +
        '<div class="card"><div class="card-title">Farm history</div>' + historyHtml(tl, r.id) + "</div>" +
        '</div><div class="d-col">' +
        '<div class="card"><div class="card-title">AI findings</div><div class="kv2">' +
        "<div><span>Decision</span><b>" + UI.esc(UI.label(DECISION_LABELS, a.decision)) + "</b></div>" +
        "<div><span>Model-reported confidence</span><b>" + UI.esc(UI.label(CONFIDENCE_LABELS, a.confidence_band)) + "</b></div>" +
        "<div><span>Photo quality</span><b>" + UI.esc(a.image_quality === "good" ? "Good" : a.image_quality === "poor" ? "Poor" : "\u2014") + "</b></div>" +
        "<div><span>Escalation reason</span><b>" + UI.esc(reason || "\u2014") + "</b></div></div>" +
        '<div class="card-title" style="margin:16px 0 8px">Visible symptoms</div>' +
        (symptoms.length ? '<div class="row" style="gap:8px">' + symptoms.map(function (s) { return '<span class="chip chip-lime">' + UI.esc(s) + "</span>"; }).join("") + "</div>"
                         : '<div class="muted" style="font-size:14px">No visible symptoms were recorded.</div>') +
        '<p class="small" style="margin-top:12px">Preliminary assessment, not a confirmed diagnosis. Confidence is model-reported and not calibrated.</p></div>' +
        '<div class="card"><div class="row between" style="margin-bottom:14px"><div class="card-title" style="margin:0">Weather context</div>' + (r.weather ? dataSourceBadge(r.weather.data_source) : "") + "</div>" + weatherHtml(r.weather) + "</div>" +
        '<div class="card"><div class="card-title">Risk indicator</div>' + riskHtml(r.risk) + "</div>" +
        reviewSection(r) +
        "</div></div>" +
        '<div class="d-grid"><div class="card">' + renderWhyBox(r.why) + '</div><div class="card"><div class="card-title">Status timeline</div>' + renderStatusTimeline(r.events) + "</div></div>";

      if (tl && !tl.ok) UI.showError(document.getElementById("histErr"), tl.error, function () { loadCase(r.id); });

      var form = document.getElementById("reviewForm");
      if (form) form.addEventListener("submit", function (e) { e.preventDefault(); sendReview(r.id); });
    }

    async function loadCase(id, successReview) {
      var token = ++loadToken;
      UI.showLoading(detail, "card", 2);
      var results = await Promise.all([getReport(id), null]);
      var rep = results[0];
      if (token !== loadToken) return;
      if (!rep.ok) { UI.showError(detail, rep.error, function () { loadCase(id); }); return; }
      var tl = await getFarmTimeline(rep.data.farm_id);
      if (token !== loadToken) return;
      try { renderDetail(rep.data, findCase(id), tl, successReview || null); }
      catch (e) { UI.showError(detail, { code: "INTERNAL_ERROR", message: "This case could not be displayed." }, function () { loadCase(id); }); }
    }

    /* ---------------- submit review ---------------- */
    async function sendReview(reportId) {
      var name = document.getElementById("expertName").value.trim();
      var guidance = document.getElementById("guidance").value.trim();
      var confirmed = document.getElementById("confirmedIssue").value;
      var errBox = document.getElementById("formError");
      var btn = document.getElementById("submitBtn");
      errBox.innerHTML = "";

      if (!name || !guidance) {
        UI.showError(errBox, { code: "INVALID_REQUEST", message: "Please enter your name and guidance for the farmer." });
        return;
      }
      var body = { expert_name: name, guidance: guidance, confirmed_issue: confirmed === "" ? null : confirmed };

      btn.disabled = true;
      btn.firstChild.textContent = "Sending\u2026 ";
      var res = await submitReview(reportId, body);

      if (!res.ok) {
        btn.disabled = false;
        btn.firstChild.textContent = "Send review ";
        UI.showError(errBox, res.error);
        if (res.error.code === "CONFLICT") { UI.toast("This case was already reviewed.", "error"); setTimeout(function () { loadCase(reportId); loadQueue(); }, 1200); }
        return;
      }
      UI.toast("Review sent. Status: " + UI.label(STATUS_LABELS, res.data.status), "success");
      await loadCase(reportId, res.data.review);
      await loadQueue();
    }

    /* ---------------- start ---------------- */
    async function init() {
      loadToken++;
      placeholder();
      var ok = await loadQueue();
      if (ok && selectedId) loadCase(selectedId);
      else if (ok) placeholder();
    }
    init();
  </script>
</body>
</html>
