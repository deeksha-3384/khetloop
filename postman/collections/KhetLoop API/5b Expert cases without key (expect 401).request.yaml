$kind: http-request
url: "{{baseUrl}}/api/expert/cases"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 401", function () { pm.response.to.have.status(401); });
      pm.test("envelope has ok", function () { pm.expect(pm.response.json()).to.have.property("ok"); });
    language: text/javascript
order: 10000
