$kind: http-request
url: "{{baseUrl}}/api/demo/simulate-cluster"
method: POST
headers:
  Accept: application/json
  X-Expert-Key: "{{expertKey}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "crop": "tomato",
      "suspected_issue": "early_blight",
      "area_label": "Kolar North",
      "target_farm_id": "{{farmId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", function () { pm.response.to.have.status(200); });
      pm.test("envelope has ok", function () { pm.expect(pm.response.json()).to.have.property("ok"); });
    language: text/javascript
order: 17000
