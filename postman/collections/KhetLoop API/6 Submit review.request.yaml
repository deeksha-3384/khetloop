$kind: http-request
url: "{{baseUrl}}/api/expert/cases/{{reportId}}/review"
method: POST
headers:
  Accept: application/json
  X-Expert-Key: "{{expertKey}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expert_name": "Demo Expert",
      "guidance": "Remove affected leaves and keep foliage dry. Please share a photo in 2 days.",
      "confirmed_issue": "early_blight"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 201", function () { pm.response.to.have.status(201); });
      pm.test("envelope has ok", function () { pm.expect(pm.response.json()).to.have.property("ok"); });
    language: text/javascript
order: 11000
