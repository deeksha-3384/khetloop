<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KhetLoop API Test</title>
  <style>
    body { margin:0; padding:32px; background:#08110c; color:#eef3ea; font-family:Consolas,monospace; font-size:14px; }
    h1 { font-family:Georgia,serif; color:#a3d65c; }
    .pass { color:#a3d65c; } .fail { color:#ff7b7b; }
    pre { white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>KhetLoop API test (USE_MOCK must be true)</h1>
  <pre id="out">Running...</pre>

  <script src="js/config.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/api.js"></script>
  <script>
    (async function () {
      var out = document.getElementById("out");
      out.innerHTML = "";
      var failures = 0;

      // expectCode = null means the call should succeed
      function check(name, res, expectCode) {
        var pass = expectCode ? (!res.ok && res.error.code === expectCode) : res.ok;
        if (!pass) failures++;
        var detail = res.ok ? "ok" : (res.error.code + ": " + res.error.message);
        out.innerHTML += '<span class="' + (pass ? "pass" : "fail") + '">' +
          (pass ? "PASS " : "FAIL ") + name + (expectCode ? " (expects " + expectCode + ")" : "") +
          "</span>  -> " + detail + "\n";
      }

      check("listFarms", await listFarms(), null);
      check("getReport escalated", await getReport("rep_a1b2c3d4"), null);
      check("getReport preliminary", await getReport("rep_b2c3d4e5"), null);
      check("getReport abstain", await getReport("rep_c3d4e5f6"), null);
      check("getReport expert reviewed", await getReport("rep_d4e5f6a7"), null);
      check("getReport unknown id", await getReport("rep_00000000"), "NOT_FOUND");
      check("getFarmTimeline", await getFarmTimeline("farm_4a5b6c7d"), null);
      check("listExpertCases", await listExpertCases("expert_review_pending"), null);
      check("submitReview missing guidance", await submitReview("rep_a1b2c3d4", { expert_name: "Demo Expert" }), "INVALID_REQUEST");
      check("submitReview valid", await submitReview("rep_a1b2c3d4", {
        expert_name: "Demo Expert",
        guidance: "Remove affected leaves and monitor the plant.",
        confirmed_issue: "early_blight"
      }), null);
      check("submitReview again", await submitReview("rep_a1b2c3d4", {
        expert_name: "Demo Expert", guidance: "Again", confirmed_issue: null
      }), "CONFLICT");
      check("getClusters", await getClusters(), null);
      check("getClusterDetail", await getClusterDetail("clu_1a2b3c4d"), null);
      check("runReminders", await runReminders(), null);
      check("simulateCluster", await simulateCluster({ crop: "tomato", suspected_issue: "early_blight", area_label: "Kolar North", target_farm_id: "farm_4a5b6c7d" }), null);
      check("getHealth", await getHealth(), null);

      var fd = new FormData();
      fd.append("farm_id", "farm_4a5b6c7d");
      check("submitReport without image", await submitReport(fd), "INVALID_REQUEST");
      fd.append("image", new Blob(["x"], { type: "image/jpeg" }), "test.jpg");
      check("submitReport with image", await submitReport(fd), null);

      out.innerHTML += "\n" + (failures === 0
        ? '<span class="pass">ALL CHECKS PASSED</span>'
        : '<span class="fail">' + failures + " CHECK(S) FAILED</span>");
    })();
  </script>
</body>
</html>
